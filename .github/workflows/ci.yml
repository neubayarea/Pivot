# TEMPORARY (Bx7 #190, do not merge): find the first step where the macOS runner and Windows differ.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  platform-trace:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run python -c "import numpy, sys, platform; print(sys.version, numpy.__version__, platform.machine()); numpy.show_runtime()"
      - run: uv run python scratch_trace.py mac out
      - uses: actions/upload-artifact@v4
        with:
          name: trace
          path: out/
