name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      # Ruff 0.17 widened its default rules, so pin the version and select the
      # classic defaults explicitly. E741 is ignored until existing code is tidied.
      - run: uvx ruff@0.17.2 check --select E4,E7,E9,F --ignore E741 .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run pytest

  # The web page's tests, including the i18n guard (no English typed into JSX, Ax31), and its type check.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npx -y pnpm@12.3.4 install --frozen-lockfile --filter web...
      - run: npx -y pnpm@12.3.4 --filter web test
      - run: npx -y pnpm@12.3.4 --filter web lint

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run scripts/export_contracts.py
      - name: Fail if the committed contracts are out of date
        run: git diff --exit-code packages/contracts

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scans only the commits in this push or pull request (the whole history on the first push).
      - name: Install trufflehog
        run: |
          curl -sSfL -o /tmp/th.tar.gz https://github.com/trufflesecurity/trufflehog/releases/download/v3.88.0/trufflehog_3.88.0_linux_amd64.tar.gz
          tar -xzf /tmp/th.tar.gz -C /tmp trufflehog && sudo mv /tmp/trufflehog /usr/local/bin/
      - name: Scan new commits for secrets
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            trufflehog git file://. --results=verified,unknown --fail --no-update
          else
            trufflehog git file://. --since-commit "$BASE" --branch HEAD --results=verified,unknown --fail --no-update
          fi
