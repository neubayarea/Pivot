# TEMPORARY (Bx5 #161, do not merge): the frame tests from main and from the fix, 8 at once each, on the Mac.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  bx5-stress:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: git show origin/main:apps/api/tests/test_sims.py > apps/api/tests/test_sims_main.py
      - name: stress
        run: |
          for f in test_sims_main test_sims; do
            for round in 1 2; do
              for i in $(seq 1 8); do
                uv run pytest -q -p no:cacheprovider --basetemp=/tmp/bx5-$f-$round-$i apps/api/tests/$f.py \
                  -k "frames_of_a or frames_404 or lists_simulated" > /tmp/bx5-$f-$round-$i.txt 2>&1 &
              done
              wait
            done
            echo "== $f"; grep -hoE "[0-9]+ (failed|passed)[^=]*" /tmp/bx5-$f-*.txt | sed 's/ in .*//' | sort | uniq -c
            grep -h "^E  " /tmp/bx5-$f-*.txt | sort | uniq -c | head -5
          done
