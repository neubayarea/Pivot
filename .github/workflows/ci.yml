name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      # Ruff 0.17 widened its default rules, so pin the version and select the
      # classic defaults explicitly. E741 is ignored until existing code is tidied.
      - run: uvx ruff@0.17.2 check --select E4,E7,E9,F --ignore E741 .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run pytest

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run scripts/export_contracts.py
      - name: Fail if the committed contracts are out of date
        run: git diff --exit-code packages/contracts

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Scans only the commits in this push or pull request.
      - uses: trufflesecurity/trufflehog@v3.99.4
        with:
          extra_args: --results=verified,unknown
