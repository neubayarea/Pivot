# TEMPORARY (do not merge): does the same seed give the same match on the macOS runner as on Windows?
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  platform-check:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uname -a; uv run python -c "import numpy, sys, platform; print(sys.version, numpy.__version__, platform.machine()); numpy.show_config()"
      - run: uv run python scratch_probe.py
      - run: uv run scripts/sim_fingerprint.py
      - run: uv run scripts/make_demo.py --seed 29 && uv run scripts/make_season.py
      - run: git status --porcelain; git diff --stat; shasum -a 256 eval/fixtures/*
