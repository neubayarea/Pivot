# TEMPORARY (Bx7 #190, do not merge): does #192 play every seed the same on the macOS runner as on Windows?
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-192:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv sync --locked
      - run: uv run scripts/sim_fingerprint.py --seeds $(seq 1 60)
      - run: uv run scripts/make_season.py && uv run scripts/make_demo.py --seed 29
      - run: git status --porcelain; shasum -a 256 eval/fixtures/*
