<title>Pivot Match Page Redesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: one question at the top, the momentum strip as the navigator, three moment cards, one open moment, everything else folded below.
   Tokens are the live site's Matchday Programme tokens (apps/web/src/styles/tokens.css). */
:root {
  --pv-paper: #ECEEE8; --pv-sheet: #F8F8F3; --pv-ink: #121A3A; --pv-ink-2: #4A5272; --pv-hair: #C3C8BE;
  --pv-dot: rgba(18, 26, 58, 0.09); --pv-bar: #121A3A; --pv-on-bar: #F8F8F3; --pv-bar-line: #3A4570;
  --pv-gold: #FFC53A; --pv-on-gold: #121A3A; --pv-gold-soft: #FFE6A3; --pv-red: #D22B3C; --pv-on-red: #FFFFFF;
  --pv-home: #1C2C6E; --pv-away: #D22B3C; --pv-draw: #B9BFB4; --pv-on-team: #FFFFFF;
  --pv-ok-bg: #121A3A; --pv-ok-fg: #FFC53A; --pv-warn-bg: #FCEBC4; --pv-warn-fg: #7A4700;
  --pv-pitch: #D9DFD5; --pv-pitch-line: #121A3A; --pv-ball: #FFFFFF;
  --pv-display: "Alfa Slab One", "Rockwell", Georgia, "Noto Sans SC", serif;
  --pv-body: "Archivo", "Noto Sans SC", system-ui, sans-serif;
  --pv-label: "Archivo Narrow", "Archivo", "Noto Sans SC", sans-serif;
  --pv-fs-xs: 11px; --pv-fs-sm: 13px; --pv-fs-md: 15px; --pv-fs-lg: 19px; --pv-fs-xl: 26px; --pv-fs-2xl: 38px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pv-paper: #0D1330; --pv-sheet: #161E42; --pv-ink: #F1EFE4; --pv-ink-2: #A9B0CC; --pv-hair: #2E3762;
    --pv-dot: rgba(241, 239, 228, 0.06); --pv-bar: #060A1E; --pv-on-bar: #F1EFE4; --pv-bar-line: #2E3762;
    --pv-gold-soft: #3B3418; --pv-red: #FF5A67; --pv-home: #8FA6FF; --pv-away: #FF6B76; --pv-draw: #4A5276; --pv-on-team: #0D1330;
    --pv-ok-bg: #FFC53A; --pv-ok-fg: #121A3A; --pv-warn-bg: #3A2F14; --pv-warn-fg: #F0B451;
    --pv-pitch: #1B2A4A; --pv-pitch-line: #C9CDE0; --pv-ball: #FFFFFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --pv-paper: #0D1330; --pv-sheet: #161E42; --pv-ink: #F1EFE4; --pv-ink-2: #A9B0CC; --pv-hair: #2E3762;
  --pv-dot: rgba(241, 239, 228, 0.06); --pv-bar: #060A1E; --pv-on-bar: #F1EFE4; --pv-bar-line: #2E3762;
  --pv-gold-soft: #3B3418; --pv-red: #FF5A67; --pv-home: #8FA6FF; --pv-away: #FF6B76; --pv-draw: #4A5276; --pv-on-team: #0D1330;
  --pv-ok-bg: #FFC53A; --pv-ok-fg: #121A3A; --pv-warn-bg: #3A2F14; --pv-warn-fg: #F0B451;
  --pv-pitch: #1B2A4A; --pv-pitch-line: #C9CDE0; --pv-ball: #FFFFFF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: radial-gradient(circle, var(--pv-dot) 1.1px, transparent 1.4px) 0 0 / 7px 7px, var(--pv-paper);
  color: var(--pv-ink); font-family: var(--pv-body); font-size: var(--pv-fs-md); line-height: 1.6;
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--pv-gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; }

/* prototype strip */
.proto { background: var(--pv-gold); color: var(--pv-on-gold); font-family: var(--pv-label); font-weight: 700; font-size: var(--pv-fs-xs); letter-spacing: .12em; text-transform: uppercase; }
.proto .wrap { display: flex; gap: 12px; flex-wrap: wrap; padding-block: 4px; }

/* ---------- Top bar ---------- */
.top { background: var(--pv-bar); color: var(--pv-on-bar); }
.top .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; flex-wrap: wrap; }
.brand { font-family: var(--pv-display); font-size: 24px; line-height: 1; display: flex; align-items: center; gap: 6px; text-transform: uppercase; }
.brand::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--pv-gold); }
.score { display: flex; align-items: center; gap: 8px; font-family: var(--pv-display); font-size: 20px; text-transform: uppercase; white-space: nowrap; }
.score .sc { background: var(--pv-gold); color: var(--pv-on-gold); min-width: 34px; text-align: center; padding: 1px 6px; }
.score .tm { font-size: 15px; letter-spacing: .02em; }
.ft { font-family: var(--pv-label); font-weight: 700; font-size: var(--pv-fs-xs); letter-spacing: .14em; text-transform: uppercase; border: 2px solid currentColor; padding: 0 6px; }
.sp { flex: 1; }
.pick { display: flex; align-items: center; gap: 6px; font-family: var(--pv-label); font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
.pick select { background: var(--pv-bar); color: var(--pv-on-bar); border: 2px solid var(--pv-bar-line); padding: 3px 6px; font-family: var(--pv-label); font-weight: 600; letter-spacing: .02em; text-transform: none; max-width: 230px; }
.seg { display: inline-flex; border: 2px solid currentColor; }
.seg button { font-family: var(--pv-label); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border: 0; background: transparent; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--pv-gold); color: var(--pv-on-gold); }
.gear { position: relative; }
.gear > button { display: inline-flex; align-items: center; gap: 6px; font-family: var(--pv-label); font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; padding: 4px 10px; border: 2px solid var(--pv-on-bar); background: transparent; color: var(--pv-on-bar); cursor: pointer; }
.gear > button svg { width: 14px; height: 14px; }
.menu { position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: 300px; max-width: calc(100vw - 32px); background: var(--pv-sheet); color: var(--pv-ink); border: 3px solid var(--pv-ink); box-shadow: 6px 6px 0 var(--pv-ink); padding: 12px 14px; display: grid; gap: 12px; }
.menu .row { display: grid; gap: 4px; }
.menu .lbl { font-family: var(--pv-label); font-weight: 700; font-size: var(--pv-fs-xs); letter-spacing: .14em; text-transform: uppercase; color: var(--pv-ink-2); }
.menu select { border: 2px solid var(--pv-ink); background: var(--pv-sheet); padding: 3px 6px; }
.menu .links { display: flex; gap: 8px; flex-wrap: wrap; border-top: 2px solid var(--pv-ink); padding-top: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--pv-label); font-weight: 700; font-size: var(--pv-fs-sm); letter-spacing: .1em; text-transform: uppercase; padding: 6px 12px; border: 2px solid var(--pv-ink); background: var(--pv-sheet); color: var(--pv-ink); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--pv-gold-soft); }
.btn.pri { background: var(--pv-gold); color: var(--pv-on-gold); box-shadow: 3px 3px 0 var(--pv-ink); }

/* ---------- Lead ---------- */
.lead { padding-block: 26px 10px; display: grid; gap: 8px; }
.kicker { justify-self: start; font-family: var(--pv-label); font-weight: 700; font-size: var(--pv-fs-sm); letter-spacing: .14em; text-transform: uppercase; background: var(--pv-red); color: var(--pv-on-red); padding: 3px 10px; }
.lead h1 { font-family: var(--pv-display); font-weight: 400; font-size: clamp(26px, 4vw, 44px); line-height: 1.08; text-transform: uppercase; max-width: 22em; }
.lead h1 em { font-style: normal; background: var(--pv-gold); color: var(--pv-on-gold); padding: 0 .18em; }
.lead p { color: var(--pv-ink-2); font-size: var(--pv-fs-lg); max-width: 46em; }

/* ---------- Momentum strip ---------- */
.card { background: var(--pv-sheet); border: 3px solid var(--pv-ink); padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.card h3, .h3 { font-family: var(--pv-label); font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; border-bottom: 3px solid var(--pv-ink); padding-bottom: 3px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.card h3 small, .h3 small { font-size: 11px; letter-spacing: .08em; color: var(--pv-ink-2); font-weight: 600; }
.legend { display: flex; gap: 14px; }
.legend i { display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .axis { stroke: var(--pv-ink); stroke-width: 1.5; }
.chart .grid { stroke: var(--pv-hair); stroke-width: 1; }
.chart text { fill: var(--pv-ink-2); font-family: var(--pv-label); font-weight: 600; font-size: 12px; }
.chart .mk { cursor: pointer; }
.chart .mk circle { fill: var(--pv-sheet); stroke: var(--pv-ink); stroke-width: 3; transition: fill .15s; }
.chart .mk text { fill: var(--pv-ink); font-family: var(--pv-display); font-size: 20px; }
.chart .mk line { stroke: var(--pv-ink); stroke-width: 2; stroke-dasharray: 4 3; }
.chart .mk:hover circle { fill: var(--pv-gold-soft); }
.chart .mk.on circle { fill: var(--pv-gold); }
.chart .mk.on text { fill: var(--pv-on-gold); }
.chart .mk.on line { stroke-dasharray: none; stroke-width: 3; }
.chart .mk:focus-visible { outline: none; }
.chart .mk:focus-visible circle { stroke: var(--pv-gold); stroke-width: 5; }
.chart .gl { font-size: 11px; fill: var(--pv-ink); }

/* ---------- Moment cards ---------- */
.moments { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.mc { text-align: left; background: var(--pv-sheet); border: 3px solid var(--pv-ink); padding: 12px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; cursor: pointer; align-content: start; position: relative; }
.mc:hover { background: var(--pv-gold-soft); }
.mc[aria-pressed="true"] { background: var(--pv-gold-soft); box-shadow: 6px 6px 0 var(--pv-ink); transform: translate(-2px, -2px); }
.mc[aria-pressed="true"]::after { content: ""; position: absolute; left: 50%; bottom: -17px; width: 22px; height: 22px; margin-left: -11px; background: var(--pv-ink); clip-path: polygon(0 0, 100% 0, 50% 60%); }
.badge { grid-row: span 3; width: 46px; height: 46px; border-radius: 50%; border: 3px solid var(--pv-ink); display: grid; place-items: center; font-family: var(--pv-display); font-size: 22px; background: var(--pv-sheet); color: var(--pv-ink); }
.mc[aria-pressed="true"] .badge { background: var(--pv-gold); color: var(--pv-on-gold); }
.mc .min { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.mc .min b { font-family: var(--pv-display); font-weight: 400; font-size: 28px; line-height: 1; }
.tag { font-family: var(--pv-label); font-weight: 700; font-size: var(--pv-fs-xs); letter-spacing: .12em; text-transform: uppercase; padding: 1px 6px; border: 2px solid var(--pv-ink); }
.mc .hd { font-weight: 700; font-size: 16px; line-height: 1.3; }
.mc .sub { color: var(--pv-ink-2); font-size: var(--pv-fs-sm); line-height: 1.45; }
.mc .ft2 { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--pv-hair); padding-top: 6px; margin-top: 4px; font-size: var(--pv-fs-xs); font-family: var(--pv-label); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.dir { display: inline-flex; align-items: center; gap: 5px; }
.dir i { width: 10px; height: 10px; display: inline-block; }
.stamp { display: inline-flex; align-items: center; gap: 4px; font-family: var(--pv-label); font-weight: 700; font-size: var(--pv-fs-xs); letter-spacing: .1em; text-transform: uppercase; padding: 1px 6px; border: 2px solid currentColor; line-height: 1.5; white-space: nowrap; }
.stamp.ok { background: var(--pv-ok-bg); color: var(--pv-ok-fg); border-color: var(--pv-ok-bg); }
.stamp.warn { background: var(--pv-warn-bg); color: var(--pv-warn-fg); border-color: var(--pv-warn-bg); }

/* ---------- Open moment ---------- */
.open { border: 3px solid var(--pv-ink); background: var(--pv-sheet); box-shadow: 6px 6px 0 var(--pv-ink); }
.open-hd { background: var(--pv-bar); color: var(--pv-on-bar); display: flex; align-items: center; gap: 14px; padding: 10px 16px; flex-wrap: wrap; }
.open-hd .badge { width: 40px; height: 40px; font-size: 19px; grid-row: auto; background: var(--pv-gold); color: var(--pv-on-gold); border-color: var(--pv-gold); }
.open-hd h2 { font-family: var(--pv-display); font-weight: 400; font-size: clamp(20px, 2.4vw, 28px); line-height: 1.1; text-transform: uppercase; flex: 1 1 18em; min-width: 0; }
.open-hd .at { font-family: var(--pv-label); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: var(--pv-fs-sm); white-space: nowrap; }
.open-hd .at b { background: var(--pv-gold); color: var(--pv-on-gold); padding: 0 6px; margin-left: 4px; }
.open-bd { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; padding: 16px; }
.why { display: grid; gap: 12px; align-content: start; min-width: 0; }
.why ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; counter-reset: s; }
.why li { counter-increment: s; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; font-size: 16.5px; line-height: 1.55; max-width: 42em; }
.why li::before { content: counter(s); font-family: var(--pv-display); font-size: 18px; color: var(--pv-red); line-height: 1.4; }
.claim { background: linear-gradient(transparent 58%, var(--pv-gold-soft) 58%); font-weight: 700; white-space: nowrap; cursor: help; }
.claim::after { content: "✓"; font-size: 10px; vertical-align: super; color: var(--pv-ink-2); margin-left: 1px; }
.ev { display: inline-flex; gap: 5px; flex-wrap: wrap; margin-left: 6px; vertical-align: 1px; }
.ev button { font-family: var(--pv-label); font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; border: 1.5px solid var(--pv-ink-2); color: var(--pv-ink-2); background: transparent; padding: 0 5px; line-height: 1.6; cursor: pointer; }
.ev button:hover, .ev button.on { background: var(--pv-ink); color: var(--pv-sheet); border-color: var(--pv-ink); }
.prov { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: var(--pv-fs-sm); color: var(--pv-ink-2); border-top: 1px solid var(--pv-hair); padding-top: 8px; }
.prov a { color: var(--pv-ink); font-weight: 600; cursor: pointer; }
.side { display: grid; gap: 8px; align-content: start; min-width: 0; }
.pitch { width: 100%; max-width: 100%; height: auto; display: block; border: 2px solid var(--pv-ink); background: var(--pv-pitch); }
.pitch .ln { fill: none; stroke: var(--pv-pitch-line); stroke-width: .35; opacity: .7; }
.pitch .h circle { fill: var(--pv-home); }
.pitch .a circle { fill: var(--pv-away); }
.pitch text { fill: var(--pv-on-team); font-family: var(--pv-label); font-weight: 700; font-size: 2.1px; text-anchor: middle; dominant-baseline: central; }
.pitch .key circle { stroke: var(--pv-gold); stroke-width: .8; }
.pitch .ball { fill: var(--pv-ball); stroke: var(--pv-ink); stroke-width: .35; }
.cap { font-size: var(--pv-fs-sm); color: var(--pv-ink-2); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.cap b { color: var(--pv-ink); }

/* what-if */
.wi { grid-column: 1 / -1; border-top: 3px solid var(--pv-ink); padding-top: 14px; display: grid; gap: 12px; }
.wi-hd { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.wi-hd h3 { font-family: var(--pv-display); font-weight: 400; font-size: 22px; text-transform: uppercase; border: 0; padding: 0; }
.wi-hd p { color: var(--pv-ink-2); font-size: var(--pv-fs-sm); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { font-family: var(--pv-label); font-weight: 700; font-size: 14px; letter-spacing: .04em; padding: 7px 14px; border: 2px solid var(--pv-ink); background: var(--pv-sheet); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.chip:hover { background: var(--pv-gold-soft); }
.chip[aria-pressed="true"] { background: var(--pv-gold); color: var(--pv-on-gold); box-shadow: 3px 3px 0 var(--pv-ink); }
.chip small { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; opacity: .75; }
.res { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px 24px; align-items: start; background: var(--pv-paper); border: 2px solid var(--pv-ink); padding: 14px; }
.res.idle { background: var(--pv-sheet); border-style: dashed; align-items: center; }
.res.idle .src { color: var(--pv-ink-2); }
.res.illu { background: repeating-linear-gradient(-45deg, var(--pv-paper) 0 10px, var(--pv-sheet) 10px 20px); }
.bars { display: grid; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 10px; align-items: center; }
.bar-row > span { font-family: var(--pv-label); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; line-height: 1.2; }
.bar { display: flex; height: 28px; border: 2px solid var(--pv-ink); overflow: hidden; }
.bar div { display: flex; align-items: center; justify-content: center; font-family: var(--pv-label); font-weight: 700; font-size: 12px; color: var(--pv-on-team); white-space: nowrap; overflow: hidden; transition: flex-basis .4s ease; min-width: 0; }
.bar .w { background: var(--pv-home); }
.bar .d { background: var(--pv-draw); color: var(--pv-ink); }
.bar .l { background: var(--pv-away); }
.bar-key { display: flex; gap: 12px; flex-wrap: wrap; font-size: var(--pv-fs-xs); font-family: var(--pv-label); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--pv-ink-2); padding-left: calc(7.5em + 10px); }
.bar-key i { display: inline-block; width: 9px; height: 9px; margin-right: 4px; }
.verdict { display: grid; gap: 8px; min-width: 0; }
.verdict .big { font-size: 19px; font-weight: 700; line-height: 1.4; }
.verdict .big .claim { white-space: normal; }
.verdict .src { font-size: var(--pv-fs-sm); color: var(--pv-ink-2); }
@media (prefers-reduced-motion: reduce) { .bar div { transition: none; } .mc[aria-pressed="true"] { transform: none; } }

/* ---------- More details ---------- */
details.more { border: 3px solid var(--pv-ink); background: var(--pv-sheet); }
details.more > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px 16px; font-family: var(--pv-label); font-weight: 700; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; flex-wrap: wrap; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+"; font-family: var(--pv-display); font-size: 22px; width: 28px; height: 28px; display: grid; place-items: center; border: 2px solid var(--pv-ink); line-height: 1; }
details.more[open] > summary::before { content: "−"; }
details.more > summary small { font-weight: 600; letter-spacing: .06em; text-transform: none; color: var(--pv-ink-2); font-size: var(--pv-fs-sm); }
.more-bd { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 0 16px 16px; }
.replay { display: grid; gap: 8px; }
.replay .stage { display: grid; place-items: center; text-align: center; min-height: 150px; border: 2px dashed var(--pv-hair); color: var(--pv-ink-2); font-family: var(--pv-label); font-weight: 700; font-size: var(--pv-fs-sm); letter-spacing: .1em; text-transform: uppercase; padding: 12px; }
.scrub { position: relative; height: 22px; border-top: 3px solid var(--pv-ink); }
.scrub span { position: absolute; top: -12px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--pv-gold); color: var(--pv-on-gold); border: 2px solid var(--pv-ink); font-family: var(--pv-display); font-size: 11px; display: grid; place-items: center; }
.evs { list-style: none; margin: 0; padding: 0; display: grid; max-height: 330px; overflow-y: auto; }
.evs li { display: grid; grid-template-columns: 3.6em 5.6em minmax(0, 1fr); gap: 8px; padding: 5px 2px; border-top: 1px solid var(--pv-hair); font-size: var(--pv-fs-sm); align-items: baseline; }
.evs li.hit { background: var(--pv-gold-soft); }
.evs .m { font-family: var(--pv-label); font-weight: 700; font-variant-numeric: tabular-nums; }
.evs .k { font-family: var(--pv-label); font-weight: 700; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.evs .k.h { color: var(--pv-home); } .evs .k.a { color: var(--pv-away); }
.stats { display: grid; gap: 7px; }
.st { display: grid; grid-template-columns: 3.5em minmax(0, 1fr) 3.5em; gap: 4px 8px; align-items: center; font-size: var(--pv-fs-sm); }

/* ---------- helpers ---------- */
let lang = "zh", sel = 0, chip = [-1, -1, -1], evOn = null;
const ran = new Set();
try { const l = localStorage.getItem("pv-proto-lang"); if (l === "en" || l === "zh") lang = l; } catch (e) {}
const L = (o) => (o && typeof o === "object" ? (o[lang] ?? o.en) : o);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
function clockLabel(min) { // elapsed minute -> the clock a viewer reads
  const t = min * 60;
  if (t < HALF2) { const m = Math.floor(t / 60); return m < 45 ? `${m + 1}` : `45+${m - 44}`; }
  const m = Math.floor((t - HALF2) / 60); return m < 45 ? `${46 + m}` : `90+${m - 44}`;
}
const span = (w) => `${clockLabel(w[0])}′–${clockLabel(w[1] - 1)}′`;
const elapsedOf = (clock) => clock <= 45 ? clock - 1 : HALF2 / 60 + (clock - 46);
const pct = (v) => `${Math.round(v * 100)}%`;
function fill(tpl, claims, asClaim) {
  return tpl.replace(/\{(\d)\}/g, (_, i) => {
    const c = claims[+i];
    if (!asClaim) return `<span class="claim">${esc(c)}</span>`;
    const tip = `${L(T.checked)}: ${L(c[1])}, ${span(c[2])} = ${c[0]}`;
    return `<span class="claim" title="${esc(tip)}">${esc(c[0])}</span>`;
  });
}

/* ---------- momentum chart ---------- */
const X0 = 30, X1 = 985, YC = 150, YS = 78, MAXM = 102;
const xOf = (m) => X0 + (m / MAXM) * (X1 - X0);
const yOf = (v) => YC - v * YS;
function drawChart() {
  const pts = TL.map(([m, v]) => `${xOf(m).toFixed(1)},${yOf(v).toFixed(1)}`);
  const area = `M${xOf(0)},${YC} L${pts.join(" L")} L${xOf(MAXM)},${YC} Z`;
  let s = `<defs><clipPath id="up"><rect x="0" y="0" width="1000" height="${YC}"/></clipPath><clipPath id="dn"><rect x="0" y="${YC}" width="1000" height="100"/></clipPath></defs>`;
  s += `<line class="grid" x1="${X0}" x2="${X1}" y1="${yOf(.5)}" y2="${yOf(.5)}"/><line class="grid" x1="${X0}" x2="${X1}" y1="${yOf(-.5)}" y2="${yOf(-.5)}"/>`;
  const ht = HALF2 / 60;
  s += `<line class="grid" x1="${xOf(ht)}" x2="${xOf(ht)}" y1="${yOf(.95)}" y2="${yOf(-.6)}" stroke-dasharray="3 3"/><text x="${xOf(ht) + 4}" y="${yOf(-.55)}">${lang === "zh" ? "半场" : "HT"}</text>`;
  s += `<path d="${area}" fill="var(--pv-home)" clip-path="url(#up)" opacity=".9"/><path d="${area}" fill="var(--pv-away)" clip-path="url(#dn)" opacity=".9"/>`;
  s += `<line class="axis" x1="${X0}" x2="${X1}" y1="${YC}" y2="${YC}"/>`;
  [1, 15, 30, 45, 60, 75, 90].forEach((c) => { const x = xOf(elapsedOf(c)); s += `<text x="${x}" y="${YC + 72}" text-anchor="middle">${c}′</text>`; });
  GOALS.forEach(([m, t, sc]) => {
    const x = xOf(m), y = t === "h" ? YC + 16 : YC - 16;
    s += `<g><circle cx="${x}" cy="${y}" r="9" fill="var(--pv-sheet)" stroke="var(--pv-ink)" stroke-width="2"/><circle cx="${x}" cy="${y}" r="3.2" fill="var(--pv-ink)"/></g>`;
  });
  PIVOTS.forEach((p, i) => {
    const x = xOf(p.min), v = TL[p.min][1];
    s += `<g class="mk${i === sel ? " on" : ""}" tabindex="0" role="button" data-i="${i}" aria-label="${i + 1}: ${clockLabel(p.min)}′ ${esc(L(p.hd))}">
      <line x1="${x}" x2="${x}" y1="42" y2="${yOf(v)}"/><circle cx="${x}" cy="24" r="21"/><text x="${x}" y="31" text-anchor="middle">${i + 1}</text>
      <text class="gl" x="${x + 26}" y="22" style="font-family:var(--pv-label);font-weight:700;font-size:13px;fill:var(--pv-ink)">${clockLabel(p.min)}′</text></g>`;
  });
  $("chart").innerHTML = s;
  $("chart").setAttribute("aria-label", L(T.mom));
  $("chart").querySelectorAll(".mk").forEach((g) => {
    g.addEventListener("click", () => pick(+g.dataset.i));
    g.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(+g.dataset.i); } });
  });
}

/* ---------- moment cards ---------- */
function drawCards() {
  $("moments").innerHTML = PIVOTS.map((p, i) => `
    <button type="button" class="mc" aria-pressed="${i === sel}" data-i="${i}">
      <span class="badge">${i + 1}</span>
      <span class="min"><b>${clockLabel(p.min)}′</b><span class="tag">${esc(L(p.tag))}</span></span>
      <span class="hd">${esc(L(p.hd))}</span>
      <span class="sub">${esc(L(p.sub))}</span>
      <span class="ft2"><span class="dir">${L(T.momTo)} <i style="background:var(--pv-${p.dir === "h" ? "home" : "away"})"></i>${p.dir === "h" ? "Harbour City" : "Northgate Rovers"}</span>
        <span class="stamp ${p.llm ? "ok" : "warn"}">${esc(L(p.llm ? T.verified : T.template))}</span></span>
    </button>`).join("");
  $("moments").querySelectorAll(".mc").forEach((b) => b.addEventListener("click", () => pick(+b.dataset.i)));
}

/* ---------- mini pitch ---------- */
function pitchSVG(p) {
  const f = FRAMES[p.frame];
  let s = `<svg class="pitch" viewBox="-2 -2 109 72" role="img" aria-label="${esc(L(p.cap))}">
    <rect class="ln" x="0" y="0" width="105" height="68"/><line class="ln" x1="52.5" y1="0" x2="52.5" y2="68"/><circle class="ln" cx="52.5" cy="34" r="9.15"/>
    <rect class="ln" x="0" y="13.84" width="16.5" height="40.32"/><rect class="ln" x="88.5" y="13.84" width="16.5" height="40.32"/>
    <rect class="ln" x="0" y="24.84" width="5.5" height="18.32"/><rect class="ln" x="99.5" y="24.84" width="5.5" height="18.32"/>
    <rect class="ln" x="-1.5" y="30.34" width="1.5" height="7.32"/><rect class="ln" x="105" y="30.34" width="1.5" height="7.32"/>`;
  f.p.forEach(([t, n, x, y]) => {
    const key = t === p.key[0] && n === p.key[1];
    s += `<g class="${t}${key ? " key" : ""}"><circle cx="${x}" cy="${y}" r="1.9"/><text x="${x}" y="${y}">${n}</text></g>`;
  });
  s += `<circle class="ball" cx="${f.ball[0]}" cy="${f.ball[1] - 2.4}" r="1"/></svg>`;
  return s;
}

/* ---------- open moment ---------- */
function bar(v) {
  return `<div class="bar">${[["w", v[0]], ["d", v[1]], ["l", v[2]]].map(([k, x]) => `<div class="${k}" style="flex:0 0 ${(x * 100).toFixed(1)}%">${x >= .08 ? pct(x) : ""}</div>`).join("")}</div>`;
}
function drawOpen() {
  const p = PIVOTS[sel], c = chip[sel] < 0 ? null : p.chips[chip[sel]];
  const sents = p.s.map((x) => `<li><span>${fill(L(x), x.c, true)}<span class="ev">${x.e.map((id) => `<button type="button" data-ev="${id}" class="${evOn === id ? "on" : ""}" title="${esc(L(EV[id]))}">${EV[id].m} ${esc(L(EV[id]).split(" · ")[0])}</button>`).join("")}</span></span></li>`).join("");
  $("open").innerHTML = `
    <div class="open-hd"><span class="badge">${sel + 1}</span><h2>${clockLabel(p.min)}′ · ${esc(L(p.hd))}</h2>
      <span class="at">${L(T.at)}<b>${p.before}</b>${p.before !== p.after ? ` → <b>${p.after}</b>` : ""}</span></div>
    <div class="open-bd">
      <div class="why">
        <ol>${sents}</ol>
        <div class="prov"><span class="stamp ${p.llm ? "ok" : "warn"}">${esc(L(p.llm ? T.verified : T.template))}</span><span>${esc(L(p.llm ? T.provLLM : T.provTpl))}</span><a id="seelog" tabindex="0">${esc(L(T.seeLog))} →</a></div>
      </div>
      <div class="side">${pitchSVG(p)}<div class="cap"><span><b>${esc(L(p.cap))}</b></span></div></div>
      <div class="wi">
        <div class="wi-hd"><h3>${esc(L(T.wiH))}</h3><p>${esc(L(T.wiP))}</p></div>
        <div class="chips" role="group">${p.chips.map((x, i) => `<button type="button" class="chip" aria-pressed="${i === chip[sel]}" data-c="${i}">${esc(L(x))}${x.real ? "" : ` <small>${esc(L(T.illuTag))}</small>`}</button>`).join("")}</div>
        ${!c ? `<div class="res idle"><p class="src">${esc(L(T.pickChip))}</p></div>`
        : !ran.has(`${sel}:${chip[sel]}`) ? `<div class="res idle"><div class="verdict"><p class="big">${esc(L(T.willChange))} ${esc(L(c))}</p>
            <p class="src">${esc(L(T.howRun).replace("{m}", clockLabel(p.min) + "′"))} ${esc(L(c.real ? T.hasCache : T.noCache))}</p></div>
            <div><button type="button" class="btn pri" id="run">${esc(L(T.run))}</button></div></div>`
        : `<div class="res${c.real ? "" : " illu"}">
          <div class="bars">
            <div class="bar-row"><span>${esc(L(T.actual))}</span>${bar(c.b)}</div>
            <div class="bar-row"><span>${esc(L(c))}</span>${bar(c.f)}</div>
            <div class="bar-key"><span><i style="background:var(--pv-home)"></i>${L(T.hw)}</span><span><i style="background:var(--pv-draw)"></i>${L(T.dr)}</span><span><i style="background:var(--pv-away)"></i>${L(T.aw)}</span></div>
          </div>
          <div class="verdict"><p class="big">${fill(L(c.v), c.v.c, false)}</p><p class="src">${esc(L(c.real ? T.real : T.illu))}</p></div>
        </div>`}
      </div>
    </div>`;
  $("open").querySelectorAll(".chip").forEach((b) => b.addEventListener("click", () => { chip[sel] = +b.dataset.c; drawOpen(); }));
  if ($("run")) $("run").addEventListener("click", () => { ran.add(`${sel}:${chip[sel]}`); drawOpen(); });
  $("open").querySelectorAll(".ev button").forEach((b) => b.addEventListener("click", () => showEvent(b.dataset.ev)));
  const go = () => { $("more").open = true; $("logcard").scrollIntoView({ behavior: "smooth", block: "start" }); };
  $("seelog").addEventListener("click", go);
  $("seelog").addEventListener("keydown", (e) => { if (e.key === "Enter") go(); });
}
function showEvent(id) {
  evOn = evOn === id ? null : id;
  drawOpen(); drawEvents();
  if (evOn) { $("more").open = true; const li = document.querySelector(".evs li.hit"); if (li) li.scrollIntoView({ behavior: "smooth", block: "center" }); }
}

/* ---------- more details ---------- */
function drawEvents() {
  $("evs").innerHTML = EVLIST.map(([m, t, k, id, who, sc]) => `<li class="${id && id === evOn ? "hit" : ""}"><span class="m">${m}</span><span class="k ${t}">${esc(L(T[k]))}</span><span>${esc(who)}${sc ? ` <b class="num">${sc}</b>` : ""}</span></li>`).join("");
  $("scrub").innerHTML = PIVOTS.map((p, i) => `<span style="left:${(p.min / MAXM) * 100}%">${i + 1}</span>`).join("");
}
function drawStats() {
  const rows = [[{en:"Possession (by passes)",zh:"控球（按传球）"},"57%","43%",.57],[{en:"Shots",zh:"射门"},13,6,13/19],[{en:"On target",zh:"射正"},5,1,5/6],[{en:"xG",zh:"预期进球 xG"},"2.25","0.77",2.25/3.02],[{en:"Passes",zh:"传球"},482,363,482/845],[{en:"Yellow / red",zh:"黄牌 / 红牌"},"2 / 0","2 / 1",.4],[{en:"Pressures",zh:"逼抢"},85,141,85/226]];
  $("stats").innerHTML = rows.map(([n, a, b, r]) => `<div class="st"><span class="nm">${esc(L(n))}</span><span class="v">${a}</span><span class="tr"><div style="width:${r * 100}%"></div></span><span class="v">${b}</span></div>`).join("");
}
function drawLog() {
  $("log").innerHTML = TRACES.map((c) => `<div class="chain"><span class="who">${esc(L(c.who))}</span><div class="steps">${c.st.map(([a, b, bad], i) => `${i ? "<i>→</i>" : ""}<span class="${bad ? "bad" : ""}">${esc(a)} · ${esc(b)}</span>`).join("")}</div></div>`).join("");
}

/* ---------- text + controls ---------- */
function drawText() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  const map = { proto:"proto", proto2:"proto2", ft:"ft", match:"match", settings:"settings", view:"view", myteam:"myteam", player:"player", noplayer:"noplayer", theme:"theme", demo:"demo", tracelink:"tracelink", kicker:"kicker", lede:"lede", mom:"mom", more:"more", more2:"more2", replay:"replay", replay2:"replay2", replay3:"replay3", events:"events", events2:"events2", stats:"stats", log:"log", log2:"log2", foot:"foot" };
  Object.entries(map).forEach(([id, k]) => { const el = $("t-" + id); if (el) el.textContent = L(T[k]); });
  $("t-h1").innerHTML = L(T.h1);
  $("aud-a").textContent = L(T.audA); $("aud-f").textContent = L(T.audF); $("tm-0").textContent = L(T.none);
  $("th-auto").textContent = L(T.auto); $("th-light").textContent = L(T.light); $("th-dark").textContent = L(T.dark);
  $("lang-en").setAttribute("aria-pressed", lang === "en"); $("lang-zh").setAttribute("aria-pressed", lang === "zh");
}
function pick(i) { sel = i; evOn = null; drawChart(); drawCards(); drawOpen(); drawEvents(); }
function render() { drawText(); drawChart(); drawCards(); drawOpen(); drawEvents(); drawStats(); drawLog(); }

$("match").innerHTML = MATCHES.map(([id, n]) => `<option value="${id}">${n}</option>`).join("");
$("match").addEventListener("change", (e) => { if (e.target.value !== "M-seed-29") { e.target.value = "M-seed-29"; const k = $("t-kicker"); k.textContent = L(T.pickOther); setTimeout(() => (k.textContent = L(T.kicker)), 2200); } });
document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => { lang = b.dataset.lang; try { localStorage.setItem("pv-proto-lang", lang); } catch (e) {} render(); }));
$("gear").addEventListener("click", () => { const m = $("menu"); m.hidden = !m.hidden; $("gear").setAttribute("aria-expanded", !m.hidden); });
document.addEventListener("click", (e) => { if (!e.target.closest(".gear")) { $("menu").hidden = true; $("gear").setAttribute("aria-expanded", "false"); } });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { $("menu").hidden = true; $("gear").setAttribute("aria-expanded", "false"); } });
const segPress = (sel1) => document.querySelectorAll(sel1).forEach((b) => b.addEventListener("click", () => { b.parentElement.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b)); }));
segPress("#aud-a, #aud-f"); segPress(".tm-b"); segPress(".th-b");
document.querySelectorAll(".th-b").forEach((b) => b.addEventListener("click", () => { if (b.dataset.th) document.documentElement.dataset.theme = b.dataset.th; else delete document.documentElement.dataset.theme; }));
$("t-tracelink").addEventListener("click", () => { $("menu").hidden = true; $("more").open = true; $("logcard").scrollIntoView({ behavior: "smooth", block: "start" }); });
render();
</script>
