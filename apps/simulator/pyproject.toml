[project]
name = "pivot-simulator"
version = "0.1.0"
description = "Pivot simulator: live runner and batch rollouts."
requires-python = ">=3.12"
dependencies = ["pivot-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pivot_simulator"]
