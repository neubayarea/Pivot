[project]
name = "pivot-worker"
version = "0.1.0"
description = "Pivot worker: workflows, agents and prompts."
requires-python = ">=3.12"
dependencies = [
    "pivot-core",
    "pivot-adapters",
    # Pinned exactly to a release at least two weeks old: the SDK moves fast, and DetectWorkflow is the only code that touches it (ADR-0004).
    "agent-framework-core==1.21.0",
    "openai>=1.50,<4",
    "azure-identity>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pivot_worker"]
