[project]
name = "pivot-worker"
version = "0.1.0"
description = "Pivot worker: workflows, agents and prompts."
requires-python = ">=3.12"
dependencies = ["pivot-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pivot_worker"]
