[project]
name = "pivot-core"
version = "0.1.0"
description = "Pivot domain core: shared data models, simulator and analytics. No cloud dependencies."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "numpy>=2.0,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pivot_core"]
